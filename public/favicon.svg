<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CB7B87" />
      <stop offset="100%" stop-color="#9E4D58" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE1" />
      <stop offset="100%" stop-color="#C9A66B" />
    </linearGradient>
  </defs>
  <!-- Elegant Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#roseGrad)" />
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.85" />

  <!-- Monogram P in Elegant Serif -->
  <text x="256" y="350" font-family="Georgia, 'Playfair Display', serif" font-size="290" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P</text>

  <!-- Gold Accent Sphere -->
  <circle cx="370" cy="155" r="28" fill="url(#goldGrad)" />
</svg>
